name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.bazel }})
    strategy:
      matrix:
        os:
          - macos-15
          - ubuntu-latest
          - ubuntu-24.04-arm
        bazel:
          - 8.x
          - 9.x
          # Unlike 10.x, 10.* includes release candidates.
          - '10.*'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-version: ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.bazel }}
          cache-save: ${{ github.event_name == 'push' && github.repository == 'modular/rules_mojo' && github.ref == 'refs/heads/main' }}
      - name: Bazel Info
        run: |
          bazel version
          bazel info
      - name: CPU Info
        run: |
          lscpu || true
      # Test twice, once with path stripping + path mapping, and once without
      - run: |
          bazel test //...
          bazel test --experimental_output_paths=strip //...
      - name: Check fixit exports
        run: bazel build --experimental_output_paths=strip --//:experimental_export_fixits --output_groups=+mojo_fixits //tests:hello_world

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  # A stable check name for requiring the full test matrix and pre-commit checks.
  conclusion:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: report success
        if: ${{ needs.test.result == 'success' && needs.pre-commit.result == 'success' }}
        run: echo success
      - name: report failure
        if: ${{ needs.test.result != 'success' || needs.pre-commit.result != 'success' }}
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          exit 1

  # Compatibility aliases for the six checks required by the main CI ruleset.
  # These can be removed once the ruleset requires conclusion directly.
  required-checks:
    name: test (${{ matrix.os }}, ${{ matrix.bazel }})
    needs: conclusion
    if: ${{ always() }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]
        bazel: [latest, last_rc, last_green]
    runs-on: ubuntu-latest
    steps:
      - name: Require conclusion to succeed
        env:
          CONCLUSION_RESULT: ${{ needs.conclusion.result }}
        run: test "$CONCLUSION_RESULT" = success
