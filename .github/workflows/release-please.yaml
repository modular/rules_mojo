name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Separate from release.yaml's group because this workflow calls it.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'modular/rules_mojo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write # Dispatch CI on the release PR branch.
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GITHUB_TOKEN-created PRs and tags do not trigger other workflows.
      - name: Update release PR and release merged PRs
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          gh workflow run ci.yaml --ref "$branch"

  release:
    needs: release-please
    # Still package a created release if a later release PR update or CI dispatch fails.
    if: always() && needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yaml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
